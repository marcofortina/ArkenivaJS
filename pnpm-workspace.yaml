packages:
  - packages/*
  - examples/*
  - tools/*
overrides:
  # ExcelJS uses only the compatible CommonJS v4 API; retain the upstream bounds-check fix.
  exceljs@4.4.0>uuid: 11.1.1
  # Keep the native Parse API while removing the legacy decoder's unlicensed buffers dependency.
  exceljs@4.4.0>unzipper: 0.12.5
patchedDependencies:
  buildcheck@0.0.7: packages/sftp/compat/buildcheck-license-metadata.diff
  cpu-features@0.0.10: packages/sftp/compat/cpu-features-license-metadata.diff
  ssh2@1.17.0: packages/sftp/compat/ssh2-license-metadata.diff
  png-js@2.0.0: packages/documents-pdf/compat/png-js-license-metadata.diff
  saxes@6.0.0: packages/data-xlsx/compat/saxes-exact-optional.diff
  openid-client@6.8.8: packages/security-oauth-client/compat/openid-client-exact-optional.diff
  nats@2.29.3: packages/messaging/compat/nats-exact-optional.diff
allowBuilds:
  # The reviewed pure JavaScript SSH backend needs no optional native optimization builds.
  ssh2@1.17.0: false
  cpu-features@0.0.10: false
  # Reviewed Node-API image binaries are bundled; do not run native build/install hooks.
  sharp: false
  # Reviewed Node-API binaries are bundled; do not execute native build/install hooks.
  argon2@0.45.1: false
  # Thin mode needs no install hook or Oracle Client setup.
  oracledb@26.0.0: false
  # The reviewed protobuf runtime is complete without its version-scheme warning hook.
  protobufjs@7.6.6: false
