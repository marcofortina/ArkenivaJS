name: release-preparation
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing owner-signed exact version tag to verify and pack privately
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-preparation
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Verify the signed version, main ancestry, protected environment and exact workflow attempts
        id: candidate
        run: node scripts/release-prepare.mjs > "$RUNNER_TEMP/release-candidate.json"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PUBLIC_KEY: ${{ vars.ARKENIVA_RELEASE_PUBLIC_KEY }}
          RELEASE_KEY_FINGERPRINT: ${{ vars.ARKENIVA_RELEASE_KEY_FINGERPRINT }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check out only the verified release commit
        env:
          RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
        run: git checkout --detach "$RELEASE_COMMIT"
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - name: Run the full local verification and packed public examples
        run: pnpm verify && pnpm test:packed:examples
      - name: Retain clean commit-bound SPDX and installed dependency license inventory
        run: node tools/security/supply-chain.mjs "$RUNNER_TEMP/release-supply-chain"
      - name: Reject high or critical dependency findings
        run: pnpm audit --audit-level=high --json > "$RUNNER_TEMP/release-supply-chain/dependency-audit.json"
      - name: Rebuild and inspect all private package archives and legal notices
        run: python3 -B tools/security/package_contents.py "$RUNNER_TEMP/release-packages"
      - name: Recheck signed identity and latest required workflow attempts after preparation
        run: node scripts/release-prepare.mjs > "$RUNNER_TEMP/release-rechecked.json"
        env:
          EXPECTED_RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PUBLIC_KEY: ${{ vars.ARKENIVA_RELEASE_PUBLIC_KEY }}
          RELEASE_KEY_FINGERPRINT: ${{ vars.ARKENIVA_RELEASE_KEY_FINGERPRINT }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Retain private archives, checksums and source-bound inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preparation-${{ steps.candidate.outputs.commit }}
          path: |
            ${{ runner.temp }}/release-candidate.json
            ${{ runner.temp }}/release-rechecked.json
            ${{ runner.temp }}/release-supply-chain
            ${{ runner.temp }}/release-packages
          retention-days: 14
          if-no-files-found: error
