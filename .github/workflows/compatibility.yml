name: compatibility
on:
  workflow_dispatch:
  schedule:
    - cron: '21 6 * * 1'
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-runtime:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 25
    env:
      EXPECTED_ARCHITECTURE: ${{ matrix.target.architecture }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
        target:
          - runner: ubuntu-24.04
            architecture: x64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.target.architecture }}
      - name: Resolve the compatibility-report directory on the allocated runner
        run: printf 'ARKENIVA_TEST_REPORT_DIRECTORY=%s/arkenivajs-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify the actual runtime architecture and retain its versions
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$ARKENIVA_TEST_REPORT_DIRECTORY"
          node -e 'const assert = require("node:assert/strict"); assert.equal(process.platform, "linux"); assert.equal(process.arch, process.env.EXPECTED_ARCHITECTURE); console.log(JSON.stringify({ node: process.version, platform: process.platform, architecture: process.arch, versions: process.versions }, null, 2));' > "$ARKENIVA_TEST_REPORT_DIRECTORY/runtime.json"
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Verify benchmark analysis without external services
        run: pnpm --filter @arkenivajs/benchmark-foundation test
      - name: Verify actual packed public artifacts and executable examples
        run: pnpm test:packed:examples
      - name: Enforce Oracle mock contracts without claiming live compatibility
        run: pnpm coverage:oracle
      - name: Retain architecture, tests and coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-${{ matrix.target.architecture }}-node-${{ matrix.node }}
          path: ${{ env.ARKENIVA_TEST_REPORT_DIRECTORY }}
          retention-days: 14
          if-no-files-found: error
