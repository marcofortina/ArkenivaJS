  kafka-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAKEFLAGS: '-j2'
      npm_config_jobs: '2'
      ARKENIVA_KAFKA_DISPOSABLE: '1'
      ARKENIVA_KAFKA_CONTROL: '1'
      ARKENIVA_KAFKA_BROKER: '127.0.0.1:19092'
      ARKENIVA_KAFKA_RUN_ID: '${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.node }}'
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve the native-build and broker report directory on the allocated runner
        run: |
          printf 'ARKENIVA_TEST_REPORT_DIRECTORY=%s/kafka-reports\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          install -d -m 700 "$RUNNER_TEMP/kafka-reports"
      - name: Compile the reviewed native binding explicitly on the target Node ABI
        run: |
          set -euo pipefail
          pnpm rebuild @confluentinc/kafka-javascript 2>&1 | tee "$ARKENIVA_TEST_REPORT_DIRECTORY/native-build.log"
      - name: Compile public Kafka consumers and their declared dependencies
        run: pnpm --filter '@arkenivajs/example-kafka...' --filter '@arkenivajs/messaging-kafka...' build
      - name: Prepare private owned TLS certificates and SASL identities
        run: |
          printf 'ARKENIVA_KAFKA_SECRETS=%s/kafka-secrets\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python3 -B packages/messaging-kafka/test/fixtures/prepare.py "$RUNNER_TEMP/kafka-secrets"
      - name: Start only this job's immutable owned KRaft brokers
        run: |
          image=apache/kafka@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
          docker run -d --name arkenivajs-kafka-test --network host --cpus 2 --memory 1g \
            --label "arkenivajs.fixture.owner=$ARKENIVA_KAFKA_RUN_ID" \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:19092,CONTROLLER://:19093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:19092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:19093 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=false \
            -e 'KAFKA_HEAP_OPTS=-Xms256m -Xmx512m' "$image"
          docker run -d --name arkenivajs-kafka-secure --network host --cpus 2 --memory 1g --user 0:0 \
            --label "arkenivajs.fixture.owner=$ARKENIVA_KAFKA_RUN_ID" \
            --env-file "$ARKENIVA_KAFKA_SECRETS/secure.env" \
            -v "$ARKENIVA_KAFKA_SECRETS:/etc/kafka/secrets:ro" "$image"
          for pair in arkenivajs-kafka-test:19092 arkenivajs-kafka-secure:19096; do
            container=${pair%:*}
            port=${pair#*:}
            docker exec "$container" /opt/kafka/bin/kafka-topics.sh --bootstrap-server "127.0.0.1:$port" \
              --create --topic orders.created --partitions 2 --replication-factor 1 \
              --config cleanup.policy=compact --config min.compaction.lag.ms=3600000
          done
          docker exec arkenivajs-kafka-secure /opt/kafka/bin/kafka-acls.sh --bootstrap-server 127.0.0.1:19096 \
            --add --allow-principal User:fixture-allowed --operation Read --operation Write --operation Describe --topic orders.created
          docker exec arkenivajs-kafka-secure /opt/kafka/bin/kafka-acls.sh --bootstrap-server 127.0.0.1:19096 \
            --add --allow-principal User:fixture-allowed --operation IdempotentWrite --cluster
          docker exec arkenivajs-kafka-secure /opt/kafka/bin/kafka-acls.sh --bootstrap-server 127.0.0.1:19096 \
            --add --allow-principal User:fixture-allowed --operation Read --operation Describe --group owned-secure- --resource-pattern-type prefixed
      - name: Verify actual native offsets, durable commits, ownership, failures, TLS/SASL and SDK privacy
        run: pnpm --filter @arkenivajs/messaging-kafka test:integration
      - name: Verify four Kafka producer profiles against independent native TLS consumption
        run: pnpm --filter @arkenivajs/benchmark-foundation test:integration:kafka
      - name: Verify the compiled public Kafka example
        run: pnpm --filter @arkenivajs/example-kafka test:integration
      - name: Verify independent public package archives with the actual native backend
        run: pnpm test:packed:examples --integration kafka
      - name: Retain native broker test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kafka-results-node-${{ matrix.node }}
          path: ${{ env.ARKENIVA_TEST_REPORT_DIRECTORY }}
          retention-days: 14
          if-no-files-found: error
      - name: Remove only brokers carrying this job's ownership label
        if: always()
        run: |
          for container in arkenivajs-kafka-test arkenivajs-kafka-secure; do
            owner=$(docker inspect --format '{{ index .Config.Labels "arkenivajs.fixture.owner" }}' "$container" 2>/dev/null || true)
            if [ "$owner" = "$ARKENIVA_KAFKA_RUN_ID" ]; then docker rm -f "$container"; fi
          done
