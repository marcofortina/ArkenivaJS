name: ci
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Resolve the test-report directory on the allocated runner
        run: printf 'ARKENIVA_TEST_REPORT_DIRECTORY=%s/arkenivajs-test-reports\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Verify benchmark statistics and the synthetic identity fixture
        run: pnpm --filter @arkenivajs/benchmark-foundation test
      - name: Compile and execute examples against packed public artifacts
        run: pnpm test:packed:examples
      - name: Enforce Oracle mock contracts without a live compatibility claim
        run: pnpm coverage:oracle
      - name: Retain dependency audit evidence and fail on high or critical findings
        run: pnpm audit --audit-level=high --json > "$ARKENIVA_TEST_REPORT_DIRECTORY/dependency-audit.json"
      - name: Retain unit, contract, coverage and audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-node-${{ matrix.node }}
          path: ${{ env.ARKENIVA_TEST_REPORT_DIRECTORY }}
          retention-days: 14
          if-no-files-found: error

  standard-apis-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
        package:
          [
            'cli',
            'data-barcodes',
            'data-compression',
            'data-csv',
            'data-identifiers',
            'data-json',
            'data-time',
            'data-validation',
            'data-xml',
            'dns',
            'mail',
            'messaging-amqp',
            'security-apikey',
            'security-crypto',
            'security-http',
            'security-ldap',
            'security-magiclink',
            'security-oauth-client',
            'security-mtls',
            'security-password',
            'security-sessions',
            'security-x509',
            'socket',
            'sftp',
            'soap',
            'grpc',
            'upload',
            'webhooks',
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - name: Compile the optional adapter and its declared workspace dependencies
        run: pnpm --filter "@arkenivajs/${{ matrix.package }}..." build
      - name: Enforce public types, negative fixtures and source policy
        run: pnpm --filter "@arkenivajs/${{ matrix.package }}" typecheck && pnpm --filter "@arkenivajs/${{ matrix.package }}" lint
      - name: Verify native security adapters, adversarial input and bounded lifecycle
        run: pnpm --filter "@arkenivajs/${{ matrix.package }}" test

  xml-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ARKENIVA_XML_DISPOSABLE: '1'
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - name: Install only the reviewed native schema backend on the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libxml2=2.9.14+dfsg-1.3ubuntu3.10 libxml2-utils=2.9.14+dfsg-1.3ubuntu3.10
      - run: pnpm --filter '@arkenivajs/example-xml...' build
      - name: Verify actual native schema decisions, offline imports, process cancellation and filesystem controls
        run: python3 examples/xml/test/fixtures/run.py -- pnpm --filter @arkenivajs/data-xml test:integration
      - name: Verify the compiled public XSD application and private standard/detailed SDK observations
        run: python3 examples/xml/test/fixtures/run.py -- pnpm --filter @arkenivajs/example-xml test:integration
      - name: Verify XSD through independently installed archives in the isolated test namespace
        run: pnpm test:packed:examples --integration xml

  amqp-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - name: Create the pinned owned RabbitMQ fixture with verified AMQPS and private ACLs
        run: python3 -B packages/messaging-amqp/test/fixtures/prepare.py --github-env "$GITHUB_ENV"
      - run: pnpm --filter '@arkenivajs/example-amqp...' build
      - name: Verify native confirms, returns, acknowledgments, broker restart and bounded recovery
        run: pnpm --filter @arkenivajs/messaging-amqp test:integration
      - name: Verify compiled public consumption and actual SDK diagnostics privacy
        run: pnpm --filter @arkenivajs/example-amqp test:integration
      - name: Verify the AMQPS consumer through actual independent package archives
        run: pnpm test:packed:examples --integration amqp
      - name: Remove only this job's owned RabbitMQ fixture and private secrets
        if: always() && env.ARKENIVA_AMQP_FIXTURE != ''
        run: python3 -B packages/messaging-amqp/test/fixtures/control.py teardown "$ARKENIVA_AMQP_FIXTURE"

  ldap-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - name: Build the pinned disposable OpenLDAP image
        run: docker build --tag arkenivajs-owned-ldap:r1 packages/security-ldap/test/fixtures
      - name: Create isolated directory credentials and TLS fixtures
        run: python3 packages/security-ldap/test/fixtures/prepare.py --github-env "$GITHUB_ENV"
      - run: pnpm --filter '@arkenivajs/example-ldap...' build
      - name: Verify real LDAPS, STARTTLS, pagination, injection and connection ownership
        run: pnpm --filter @arkenivajs/security-ldap test:integration
      - run: pnpm --filter @arkenivajs/example-ldap test:integration
      - name: Verify the public LDAP consumer using packed artifacts
        run: pnpm test:packed:examples --integration ldap
      - name: Stop only this job's owned directory fixtures
        if: always() && env.ARKENIVA_LDAP_FIXTURE != ''
        run: python3 packages/security-ldap/test/fixtures/teardown.py "$ARKENIVA_LDAP_FIXTURE"

  sftp-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - name: Build the pinned disposable OpenSSH image
        run: docker build --tag arkenivajs-owned-sftp:r1 packages/sftp/test/fixtures
      - name: Create isolated keys, public host pins and remote directories
        run: python3 packages/sftp/test/fixtures/prepare.py --github-env "$GITHUB_ENV"
      - run: pnpm --filter '@arkenivajs/example-sftp...' build
      - name: Verify host pinning, streaming, atomic rename and native ownership
        run: pnpm --filter @arkenivajs/sftp test:integration
      - run: pnpm --filter @arkenivajs/example-sftp test:integration
      - name: Verify the public SSH consumer using packed artifacts
        run: pnpm test:packed:examples --integration sftp
      - name: Stop only this job's owned OpenSSH fixture
        if: always() && env.ARKENIVA_SFTP_FIXTURE != ''
        run: python3 packages/sftp/test/fixtures/teardown.py "$ARKENIVA_SFTP_FIXTURE"

  mail-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@arkenivajs/example-mail...' build
      - name: Exercise real loopback SMTP with verified STARTTLS, native MIME and isolated cancellation
        run: pnpm --filter @arkenivajs/mail test:integration
      - name: Compile and run the guide through installed public artifacts
        run: pnpm --filter @arkenivajs/example-mail test
      - run: pnpm test:packed:examples --example mail

  upload-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@arkenivajs/example-upload...' build
      - name: Exercise real multipart HTTP, HTTPS and HTTP2 with verified identity and bounded streams
        run: pnpm --filter @arkenivajs/upload test:integration
      - name: Compile and run the guide through installed public artifacts
        run: pnpm --filter @arkenivajs/example-upload test
      - run: pnpm test:packed:examples --example upload

  webhooks-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@arkenivajs/example-webhooks...' build
      - name: Exercise actual HMAC HTTP and verified HTTPS, replay rejection and bounded delivery
        run: pnpm --filter @arkenivajs/webhooks test:integration
      - name: Compile and run the guide through installed public artifacts
        run: pnpm --filter @arkenivajs/example-webhooks test
      - run: pnpm test:packed:examples --example webhooks

  telemetry-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: docker compose -f packages/telemetry/test/fixtures/compose.yaml up -d
      - run: pnpm test:integration:telemetry
        env:
          ARKENIVAJS_OTLP_ENDPOINT: http://127.0.0.1:4318
          ARKENIVAJS_OTLP_EVIDENCE_PATH: ${{ runner.temp }}/collector-evidence.json
      - run: node scripts/check-collector.mjs "$RUNNER_TEMP/collector-evidence.json" --docker
      - run: pnpm --filter @arkenivajs/example-distributed-tracing start
        env:
          ARKENIVAJS_OTLP_ENDPOINT: http://127.0.0.1:4318
      - if: always()
        run: docker compose -f packages/telemetry/test/fixtures/compose.yaml logs --no-color
      - if: always()
        run: docker compose -f packages/telemetry/test/fixtures/compose.yaml down

  metering-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify independently persisted and deduplicated event batches
        env:
          ARKENIVAJS_METER_INTEGRATION_ENDPOINT: http://127.0.0.1:14222
          ARKENIVAJS_METER_COLLECTOR_AUTHORIZATION: Bearer ci-disposable-metering-collector
          ARKENIVAJS_METER_EVIDENCE_PATH: ${{ runner.temp }}/metering-evidence.json
        run: |
          set -euo pipefail
          collector_dir=$(mktemp -d "$RUNNER_TEMP/arkeniva-metering.XXXXXX")
          python3 packages/metering/test/fixtures/collector.py --test-only --port 14222 --storage "$collector_dir/events.jsonl" > "$RUNNER_TEMP/metering-collector.log" 2>&1 &
          collector_pid=$!
          trap 'kill "$collector_pid" 2>/dev/null || true; wait "$collector_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'let ready=false; for(let attempt=0;attempt<30;attempt++){try{ready=(await fetch(process.env.ARKENIVAJS_METER_INTEGRATION_ENDPOINT+"/readyz",{signal:AbortSignal.timeout(500)})).ok;}catch{} if(ready)break; await new Promise(resolve=>setTimeout(resolve,100));} if(!ready)throw new Error("Collector did not become ready");'
          pnpm test:integration:metering
          node scripts/check-meter-collector.mjs "$ARKENIVAJS_METER_EVIDENCE_PATH" "$collector_dir/events.jsonl"

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
        postgres: ['17', '18']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify PostgreSQL fixture input guards before allocating credentials
        run: python3 packages/database-postgres/test/fixtures/test_prepare.py
      - name: Prepare private disposable credentials and TLS identities
        run: python3 packages/database-postgres/test/fixtures/prepare.py "$RUNNER_TEMP/postgres-fixture" --server-major "${{ matrix.postgres }}" --github-env "$GITHUB_ENV"
      - name: Start verified PostgreSQL and the negative certificate fixture
        run: docker compose -f packages/database-postgres/test/fixtures/compose.yaml up -d --wait --wait-timeout 90
      - name: Start an independently owned benchmark telemetry collector
        run: docker compose -p arkenivajs-benchmark-otel -f packages/telemetry/test/fixtures/compose.yaml up -d
      - run: pnpm coverage:postgres
      - name: Verify all four HTTP modes against real PostgreSQL and telemetry
        run: pnpm --filter @arkenivajs/benchmark-foundation test:integration
        env:
          ARKENIVAJS_OTLP_ENDPOINT: http://127.0.0.1:4318
      - name: Verify durable security state with an owned HTTPS OAuth provider
        run: python3 packages/security-oauth-client/test/fixtures/run.py --test-only -- pnpm --filter @arkenivajs/example-postgres test:integration
      - name: Verify the complete public PostgreSQL consumer against packed artifacts
        run: python3 packages/security-oauth-client/test/fixtures/run.py --test-only -- pnpm test:packed:examples --integration postgres
      - name: Start the pinned disposable browser with a virtual authenticator
        run: docker compose -p arkenivajs-webauthn-browser -f examples/postgres/test/fixtures/browser/compose.yaml up -d --wait --wait-timeout 40
      - name: Verify WebAuthn browser interoperability and signed multiprocess zero-counter races
        run: pnpm --filter @arkenivajs/example-postgres test:browser
        env:
          ARKENIVA_WEBAUTHN_BROWSER_DISPOSABLE: '1'
          ARKENIVA_WEBAUTHN_BROWSER_URL: http://127.0.0.1:19222
          ARKENIVA_WEBAUTHN_BROWSER_ORIGIN: http://localhost:19377
      - name: Verify browser ceremonies through packed public framework artifacts
        run: pnpm test:packed:examples --browser postgres
        env:
          ARKENIVA_WEBAUTHN_BROWSER_DISPOSABLE: '1'
          ARKENIVA_WEBAUTHN_BROWSER_URL: http://127.0.0.1:19222
          ARKENIVA_WEBAUTHN_BROWSER_ORIGIN: http://localhost:19377
      - if: always()
        run: docker compose -p arkenivajs-webauthn-browser -f examples/postgres/test/fixtures/browser/compose.yaml down
      - if: always() && env.PG_FIXTURE_DIRECTORY != ''
        run: docker compose -f packages/database-postgres/test/fixtures/compose.yaml logs --no-color
      - if: always() && env.PG_FIXTURE_DIRECTORY != ''
        run: docker compose -f packages/database-postgres/test/fixtures/compose.yaml down
      - if: always() && env.PG_FIXTURE_DIRECTORY != ''
        run: docker compose -p arkenivajs-benchmark-otel -f packages/telemetry/test/fixtures/compose.yaml down

  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare private MySQL credentials and verified DNS TLS fixtures
        run: python3 packages/database-mysql/test/fixtures/prepare.py "$RUNNER_TEMP/mysql-fixture" --github-env "$GITHUB_ENV"
      - name: Start restricted MySQL and its negative certificate endpoint
        run: docker compose -f packages/database-mysql/test/fixtures/compose.yaml up -d --wait --wait-timeout 180
      - run: pnpm coverage:mysql
      - run: pnpm --filter @arkenivajs/example-mysql test:integration
      - run: pnpm test:packed:examples --integration mysql
      - if: always() && env.MYSQL_FIXTURE_DIRECTORY != ''
        run: docker compose -f packages/database-mysql/test/fixtures/compose.yaml logs --no-color
      - if: always() && env.MYSQL_FIXTURE_DIRECTORY != ''
        run: docker compose -f packages/database-mysql/test/fixtures/compose.yaml down

  mariadb-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare private MariaDB credentials and verified DNS TLS fixtures
        run: python3 packages/database-mariadb/test/fixtures/prepare.py "$RUNNER_TEMP/mariadb-fixture" --github-env "$GITHUB_ENV"
      - name: Start restricted MariaDB and its negative certificate endpoint
        run: docker compose -f packages/database-mariadb/test/fixtures/compose.yaml up -d --wait --wait-timeout 180
      - run: pnpm coverage:mariadb
      - run: pnpm --filter @arkenivajs/example-mariadb test:integration
      - run: pnpm test:packed:examples --integration mariadb
      - if: always() && env.MARIADB_FIXTURE_DIRECTORY != ''
        run: docker compose -f packages/database-mariadb/test/fixtures/compose.yaml logs --no-color
      - if: always() && env.MARIADB_FIXTURE_DIRECTORY != ''
        run: docker compose -f packages/database-mariadb/test/fixtures/compose.yaml down

  redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Configure only the disposable runner for Redis background persistence
        run: sudo sysctl -w vm.overcommit_memory=1
      - name: Prepare private scoped ACL accounts and verified TLS identities
