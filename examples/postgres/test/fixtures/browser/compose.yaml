services:
  chromium:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    init: true
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1024m
    cpus: 2
    pids_limit: 256
    shm_size: 256m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/config
      XDG_CACHE_HOME: /tmp/cache
    command:
      - /ms-playwright/chromium-1248/chrome-linux64/chrome
      - --headless
      - --no-sandbox
      - --user-data-dir=/tmp/webauthn-profile
      - --remote-debugging-address=127.0.0.1
      - --remote-debugging-port=19222
      - --disable-background-networking
      - --disable-component-update
      - --disable-default-apps
      - --no-first-run
      - --disable-sync
      - --metrics-recording-only
      - --password-store=basic
      - --use-mock-keychain
      - --disable-breakpad
      - --enable-automation
      - about:blank
    healthcheck:
      test:
        [
          CMD,
          python3,
          -c,
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:19222/json/version", timeout=2).read(16384)',
        ]
      interval: 2s
      timeout: 3s
      retries: 15
