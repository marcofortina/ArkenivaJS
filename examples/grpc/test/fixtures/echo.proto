syntax = "proto3";
package fixture;
service Echo {
  rpc Bounce (Message) returns (Message);
  rpc Watch (Message) returns (stream Message);
  rpc Exchange (stream Message) returns (stream Message);
}
message Message {
  string value = 1;
  int64 sequence = 2;
  bytes payload = 3;
}
